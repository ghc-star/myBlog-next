# AI 机器人代码审查（GitHub 版）
# 从 go-dianping 的 ai-review.yml 移植：工作流与项目无关，只有 prompt.md / skills.md 是项目专属的"脑子"。
#   AI_REVIEW_* variables   → 下面 env 段，"项目只管配置"
#   .github/ai-review/*.md  → 评审任务书 + 项目规则
#   preflight job           → 先检查材料再干活，缺东西快速失败并给出操作指引
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened] # PR 创建、新提交推送、重新打开时各审一次
  workflow_dispatch: # 手动触发：可对任意 PR 重跑审查；没有 API key 时可用 mock 模式演示全流程
    inputs:
      pr_number:
        description: 要审查的 PR 编号
        required: true
        type: string
      mock:
        description: 演示模式（true = 跳过模型调用，用固定文本验证流程）
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  pull-requests: write # 允许把审查结果发成 PR 评论

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AI_REVIEW_PROMPT_FILE: .github/ai-review/prompt.md # 评审任务书
  AI_REVIEW_SKILLS_FILE: .github/ai-review/skills.md # 项目规则
  AI_REVIEW_OUTPUT_MARKER: "<!-- ai-review-bot -->" # 评论尾部的隐藏标记，用于找到并更新既有评论
  AI_REVIEW_MAX_DIFF_CHARS: "60000" # 发给模型的 diff 上限（控制成本）
  # 模型走任意 OpenAI 兼容接口，凭据放仓库 Secret AI_REVIEW_API_KEY。
  # 注意：GitHub Models 已于 2026-07-30 退役，不能再依赖内置 GITHUB_TOKEN 调模型。
  # 当前按中转服务 timicc.com 配置（模型 grok-4.6）；
  # 换其他服务商只需改这两个值，例如 DeepSeek https://api.deepseek.com + deepseek-chat、
  # 智谱 https://open.bigmodel.cn/api/paas/v4 + glm-4.7。
  AI_REVIEW_BASE_URL: https://timicc.com/v1
  AI_REVIEW_MODEL: grok-4.6
  AI_REVIEW_MOCK: ${{ inputs.mock || 'false' }} # 演示模式开关（workflow_dispatch 时可设 true）
  AI_REVIEW_BLOCK_ON_SEVERITIES: "" # 例如 "P0,P1"：发现对应级别问题就让流水线失败；空 = 只评论不拦截

jobs:
  preflight:
    name: 前置检查
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查审查材料、凭据与 diff
        run: |
          set -euo pipefail
          for f in "$AI_REVIEW_PROMPT_FILE" "$AI_REVIEW_SKILLS_FILE"; do
            if [ ! -f "$f" ]; then
              echo "缺少 $f —— 没有它机器人不知道按什么标准审查，请先提交该文件。"
              exit 1
            fi
          done
          if [ "$AI_REVIEW_MOCK" != "true" ] && [ -z "$AI_REVIEW_API_KEY" ]; then
            echo "未配置模型凭据（GitHub Models 已于 2026-07-30 退役，内置 GITHUB_TOKEN 不再可用）。"
            echo "请任选其一："
            echo "  1. 仓库 Settings → Secrets and variables → Actions 添加 AI_REVIEW_API_KEY，"
            echo "     并按需要调整 env 里的 AI_REVIEW_BASE_URL / AI_REVIEW_MODEL。"
            echo "  2. 用 workflow_dispatch 手动触发并勾选 mock 演示模式，体验全流程。"
            exit 1
          fi
          if [ -z "$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" | head -c 200)" ]; then
            echo "PR diff 为空，后续审查 job 将跳过。"
            exit 0
          fi
          echo "前置检查通过：prompt 与 skills 就位，凭据/演示模式就绪，diff 非空。"

  review:
    name: AI 代码审查
    needs: preflight # 前置检查不过就不浪费模型调用
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 拉取 diff、调用模型、发布评论
        run: |
          set -euo pipefail

          # ── 1. 拿本次 PR 的 diff，超长截断，控制发给模型的内容量 ──
          DIFF=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" | head -c "$AI_REVIEW_MAX_DIFF_CHARS")
          if [ -z "$DIFF" ]; then
            echo "diff 为空，跳过审查。"
            exit 0
          fi

          # ── 2. 组装 prompt：任务书 + 项目规则 进 system，diff 进 user ──
          SYSTEM=$(printf '%s\n\n# 项目规则（skills）\n\n%s' \
            "$(cat "$AI_REVIEW_PROMPT_FILE")" "$(cat "$AI_REVIEW_SKILLS_FILE")")
          USER=$(printf '请审查以下 pull request #%s 的 diff：\n\n```diff\n%s\n```' "$PR_NUMBER" "$DIFF")
          PAYLOAD=$(jq -n \
            --arg model "$AI_REVIEW_MODEL" \
            --arg system "$SYSTEM" \
            --arg user "$USER" \
            '{model: $model, temperature: 0.2,
              messages: [{role: "system", content: $system}, {role: "user", content: $user}]}')

          # ── 3. 调用模型（OpenAI 兼容接口）；mock 模式用固定文本代替，验证全链路 ──
          if [ "$AI_REVIEW_MOCK" = "true" ]; then
            REVIEW="> ⚠️ 演示模式：本次评论由固定文本生成，未调用模型。配置 AI_REVIEW_API_KEY 后即为真实审查。

            **P3** \`README.md\`：可补充 AI 审查的触发条件说明（当前仅 PR 事件触发），方便协作者理解。
            **P3** \`README.md\`：本地构建依赖 \`DB_*\` 环境变量指向可用数据库（构建期会预渲染内容页），建议在运行步骤一节注明前置条件。

            未发现需要阻塞或修改的问题。

            建议人工关注：本地执行 \`npm run lint\` 与 \`npm run build\` 确认 lint、类型检查与构建全部通过。"
            echo "演示模式：跳过模型调用。"
          else
            AUTH="${AI_REVIEW_API_KEY}"
            HTTP_CODE=$(curl -sL --max-time 180 -o model_resp.json -w '%{http_code}' \
              "$AI_REVIEW_BASE_URL/chat/completions" \
              -H "Authorization: Bearer $AUTH" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD") || { echo "curl 本身失败（exit=$?）。"; exit 1; }
            echo "模型接口返回 HTTP $HTTP_CODE。"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "非 200 响应，原始内容："
              head -c 2000 model_resp.json
              exit 1
            fi
            if ! REVIEW=$(jq -r '.choices[0].message.content // empty' model_resp.json 2>/dev/null) || [ -z "$REVIEW" ]; then
              echo "响应不是合法的补全 JSON 或没有内容，原始内容："
              head -c 2000 model_resp.json
              exit 1
            fi
            rm -f model_resp.json
          fi

          # ── 4. 可选拦截：发现指定级别问题就让流水线失败 ──
          if [ -n "$AI_REVIEW_BLOCK_ON_SEVERITIES" ]; then
            for SEV in $(printf '%s' "$AI_REVIEW_BLOCK_ON_SEVERITIES" | tr ',' ' '); do
              if printf '%s' "$REVIEW" | grep -qE "^\*\*$SEV\*\*"; then
                echo "发现 $SEV 级问题，按 AI_REVIEW_BLOCK_ON_SEVERITIES 配置拦截："
                printf '%s\n' "$REVIEW"
                exit 1
              fi
            done
          fi

          # ── 5. 发评论；同一 PR 反复推送时更新既有评论，不刷屏 ──
          BODY=$(printf '%s\n\n%s' "$REVIEW" "$AI_REVIEW_OUTPUT_MARKER")
          EXISTING_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$AI_REVIEW_OUTPUT_MARKER\")) | .id" \
            | head -1 || true)
          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments/$EXISTING_ID" \
              -f body="$BODY" >/dev/null
            echo "已更新既有审查评论（$EXISTING_ID）。"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY" >/dev/null
            echo "已发布审查评论。"
          fi
